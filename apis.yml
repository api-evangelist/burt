name: Burt
description: >-
  Burt builds AI teammates (AI coworkers) for logistics, aimed at freight
  brokers and forwarders. Its agents automate the repetitive, manual work of
  daily freight operations — track and trace, quoting, scheduling, carrier
  booking, document processing, proof-of-delivery chasing, and invoice and data
  entry — so human operators can focus on customer relationships and growing the
  business. Burt gives full visibility into every AI action with human oversight
  and approval workflows, rolls out autonomy gradually, and learns from
  operator corrections and exceptions to build institutional knowledge over
  time. Burt is a Y Combinator (Winter 2026) company. This profile was surfaced
  as a portfolio company of Y Combinator and enriched by the API Evangelist
  pipeline; Burt does not currently publish a public developer/API surface.
